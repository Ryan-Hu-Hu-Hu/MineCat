[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "minecat"
version = "1.0.0"
description = "MineCat: leakage-free prediction of enzyme kinetic parameters (K_M, k_cat) with a tree / deep / composition ensemble"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1", "numpy>=1.24,<2", "pandas>=2.0", "scipy>=1.10", "scikit-learn==1.7.2",
  "joblib>=1.3", "transformers==4.53.0", "sentencepiece>=0.1.99", "rdkit>=2022.9",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8", "umap-learn>=0.5", "pyyaml>=6.0", "pillow>=10.0"]

[tool.setuptools]
packages = ["minecat", "minecat.models", "minecat.features", "minecat.smiles_transformer"]
